name: CI

# Validates every push and pull request, and publishes staging from main.
#
# Staging deployment lives here rather than in its own workflow on purpose. A
# separate workflow has to wait for this one across a workflow boundary, and
# polling for a check that has not been created yet fails immediately with "the
# requested check was never run against this ref". Depending on a job with
# `needs` has no such race.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/validate.yml

  # Stable single name for branch protection to require, so the required check
  # does not need changing when a job inside validate.yml is added or renamed.
  gate:
    name: all gates passed
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "::error::validation failed (${{ needs.validate.result }})"
            exit 1
          fi
          echo "all gates passed"

  build-staging:
    name: build the staging artifact
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Regenerate rather than trusting the committed page, then fail if the
      # result differs from what was reviewed. What ships is what CI produced.
      - name: Build from the pinned sources
        run: python3 build.py --write

      - name: Fail if the committed page is not what the sources produce
        run: |
          if ! git diff --quiet -- index.html data.js; then
            echo "::error::index.html or data.js differs from a clean build."
            git --no-pager diff --stat -- index.html data.js
            exit 1
          fi
          echo "committed page matches a clean build"

      # Staging is served from a project subpath, so an absolute asset path would
      # 404 there while working perfectly on a laptop.
      - name: Reject absolute asset paths
        run: |
          if grep -nE '(src|href)="/(styles|app|data)' index.html; then
            echo "::error::absolute asset path found; use ./ so the project subpath works"
            exit 1
          fi
          echo "asset paths are relative"

      - name: Stamp the build and keep staging out of search results
        run: |
          printf '%s\n' \
            "staging" \
            "commit: ${GITHUB_SHA}" \
            "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD-INFO.txt
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-staging:
    name: publish staging to GitHub Pages
    needs: build-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  verify-staging:
    name: verify staging is live and correct
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # A deploy that reports success while serving a stale or broken page is a
      # failed deploy. This runs against the real URL over the real network.
      - name: Smoke-test the deployed URL
        run: node scripts/smoke.mjs "${{ needs.deploy-staging.outputs.page_url }}" "$GITHUB_SHA"
