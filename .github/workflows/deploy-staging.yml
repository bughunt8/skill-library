name: Deploy staging

# Staging lives on GitHub Pages. It needs no credentials at all: Pages is
# published with a short-lived OIDC token that Actions mints for this run.
#
# Gated on CI. A push that fails any gate is never published, even to staging.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: wait for CI to pass
    runs-on: ubuntu-latest
    steps:
      # Publishing before the tests finish would defeat the point of having them.
      - name: Require the CI gate on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: all gates passed
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  build:
    name: build the artifact in CI
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Regenerate rather than trusting the committed page, then fail if the
      # result differs from what was reviewed. The artifact that ships is the
      # artifact CI produced.
      - name: Build from source
        run: python3 build.py --write

      - name: Fail if the committed page was not what the sources produce
        run: |
          if ! git diff --quiet -- index.html data.js; then
            echo "::error::index.html or data.js differs from a clean build of the sources."
            git --no-pager diff --stat -- index.html data.js
            exit 1
          fi
          echo "committed page matches a clean build"

      # Staging is served from a project subpath, so a stray absolute asset path
      # would 404 there while working locally. Catch it before it ships.
      - name: Reject absolute asset paths
        run: |
          if grep -nE '(src|href)="/(styles|app|data)' index.html; then
            echo "::error::absolute asset path found; use ./ so the project subpath works"
            exit 1
          fi
          echo "asset paths are relative"

      - name: Mark the build as staging
        run: |
          printf '%s\n' \
            "staging" \
            "commit: ${GITHUB_SHA}" \
            "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD-INFO.txt
          # Keep staging out of search results; production is the canonical copy.
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  verify:
    name: verify staging is live and correct
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # A deploy that reports success but serves a broken or stale page is a
      # failed deploy. Smoke-test the real URL, not localhost.
      - name: Smoke-test the deployed URL
        env:
          TARGET: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node scripts/smoke.mjs "$TARGET" "$GITHUB_SHA"
